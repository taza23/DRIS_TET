name: 🚀 FB لوقت معاش يتسرما

on:
  workflow_dispatch:
    inputs:
      SOURCE_LINKS:
        description: 'روابط البث - فرق بينهم بـ ,'
        required: true

      FB_STREAM_KEYS:
        description: 'مفاتيح البث - فرق بينهم بـ ,'
        required: true

      WATERMARK_TEXT:
        description: 'نص العلامة المائية'
        required: true
        default: 'CHAFIK GHADDAR TV'

      START_TIME:
        description: 'وقت بداية البث بتوقيت UTC (مثال: 2026-09-27 20:30:00 أو 20:30:00 - اتركه فارغاً للبدء فوراً)'
        required: false
        default: ''

jobs:
  multi-broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: ⚡ Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          
      - name: 🚀 Start Multi Streaming
        shell: bash
        run: |
          echo "=============================="
          echo "🚀 PREPARING MULTI STREAM..."
          echo "=============================="
          
          START_TIME="${{ github.event.inputs.START_TIME }}"
          
          # التأكد من حساب الوقت والانتظار إذا تم تحديد START_TIME
          if [ -n "$START_TIME" ]; then
            echo "⏰ Scheduled time input: $START_TIME"
            
            TARGET_EPOCH=$(date -u -d "$START_TIME" +%s 2>/dev/null)
            CURRENT_EPOCH=$(date -u +%s)
            
            if [ -z "$TARGET_EPOCH" ]; then
              echo "❌ صيغة الوقت غير صحيحة! استعمل صيغة مثل: YYYY-MM-DD HH:MM:SS أو HH:MM:SS"
              exit 1
            fi
            
            WAIT_SECONDS=$((TARGET_EPOCH - CURRENT_EPOCH))
            
            if [ $WAIT_SECONDS -gt 0 ]; then
              WAIT_MINUTES=$((WAIT_SECONDS / 60))
              echo "⏳ باقي $WAIT_SECONDS ثانية (حوالي $WAIT_MINUTES دقيقة) حتى يبدأ البث..."
              echo "💤 جاري الانتظار..."
              sleep $WAIT_SECONDS
              echo "⏰ وصل الوقت المحدد! جاري إطلاق البث الان..."
            else
              echo "⚠️ الوقت المحدد قد مر بالفعل، سيتم إطلاق البث فوراً."
            fi
          fi

          IFS=',' read -ra SOURCES <<< "${{ github.event.inputs.SOURCE_LINKS }}"
          IFS=',' read -ra KEYS <<< "${{ github.event.inputs.FB_STREAM_KEYS }}"
          
          COUNT_SOURCES=${#SOURCES[@]}
          COUNT_KEYS=${#KEYS[@]}
          
          if [ "$COUNT_SOURCES" -ne "$COUNT_KEYS" ]; then
            echo "❌ عدد الروابط وعدد المفاتيح غير متساوي"
            exit 1
          fi
          
          for (( i=0; i<$COUNT_SOURCES; i++ ))
          do
            SOURCE=$(echo "${SOURCES[$i]}" | xargs)
            KEY=$(echo "${KEYS[$i]}" | xargs)
            
            echo "▶️ Launch Stream $((i+1))"
            ffmpeg \
            -hide_banner \
            -loglevel error \
            -reconnect 1 \
            -reconnect_streamed 1 \
            -reconnect_delay_max 10 \
            -thread_queue_size 4096 \
            -i "$SOURCE" \
            -vf "drawtext=text='${{ github.event.inputs.WATERMARK_TEXT }}':fontcolor=white:fontsize=36:borderw=2:bordercolor=black:box=1:boxcolor=black@0.4:x=w-mod(t*100\,w+tw):y=h-th-25" \
            -map 0:v:0 \
            -map 0:a? \
            -c:v libx264 \
            -preset veryfast \
            -tune zerolatency \
            -pix_fmt yuv420p \
            -profile:v main \
            -r 30 \
            -g 60 \
            -keyint_min 60 \
            -sc_threshold 0 \
            -b:v 2500k \
            -maxrate 2500k \
            -bufsize 5000k \
            -c:a aac \
            -b:a 128k \
            -ar 44100 \
            -f flv \
            "rtmps://live-api-s.facebook.com:443/rtmp/$KEY" > stream_$i.log 2>&1 &
            
            echo "✅ Stream $((i+1)) Started"
          done
          
          echo "=============================="
          echo "🔥 ALL STREAMS RUNNING"
          echo "=============================="
          
          while true
          do
            sleep 60
          done
          
